apiVersion: v1
kind: Namespace
metadata:
  name: vks-addons
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-sa
  namespace: vks-addons
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-sa-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: cert-manager-sa
  namespace: vks-addons
---
apiVersion: packaging.carvel.dev/v1alpha1
kind: PackageInstall
metadata:
  name: cert-manager
  namespace: vks-addons
spec:
  serviceAccountName: cert-manager-sa
  packageRef:
    refName: cert-manager.kubernetes.vmware.com
    versionSelection:
      constraints: 1.20.2+vmware.1-vks.1
